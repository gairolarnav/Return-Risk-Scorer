# Exact dependency closure that produced every number in this repository.
#
# requirements.txt pins the 13 direct dependencies; this pins the full
# transitive tree, so a rebuild cannot pick up a different resolution of an
# indirect package. Regenerate with:
#
#     python3.11 -m venv /tmp/lock && /tmp/lock/bin/pip install -r requirements.txt
#     /tmp/lock/bin/pip freeze
#
# Resolved on Python 3.11 from requirements.txt in a CLEAN venv, deliberately
# not by freezing a working environment: this project's own venv also holds
# streamlit, altair, jupyter and the macOS-only appnope, left over from the
# cut demo app and from executing the notebooks. Freezing that would have
# pinned 91 packages, enshrined dependencies the project does not use, and
# produced a file that cannot install on Linux.
#
# Contains no platform-specific packages, so it resolves on Linux and macOS
# alike. CI installs requirements.txt rather than this file, so the CI run
# keeps testing that the loose-but-pinned direct set still works.

