name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/test_git_attribution.py walks the whole reachable history.
          # checkout defaults to a depth-1 shallow clone, under which `git log
          # --all` sees one commit and the guard is nearly vacuous.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check src/ scripts/ tests/

      - name: Test
        run: pytest -q
